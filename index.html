<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ZENIN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #888888);
      --accent: var(--tg-theme-button-color, #3390ec);
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
      box-sizing: border-box;
    }
    .empty {
      text-align: center;
    }
    .empty h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: var(--accent);
    }
    .empty p {
      margin: 0;
      color: var(--hint);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="empty">
    <h1>ZENIN</h1>
    <p>Мини-приложение скоро появится</p>
  </div>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }
  </script>
</body>
</html>
